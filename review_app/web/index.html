<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GOGPT reviewer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>GOGPT reviewer</h1>
  <span id="scope" class="scope"></span>
  <div class="who"><span id="whoami"></span>
    <select id="theme-pick" aria-label="color theme">
      <option value="">default</option><option value="solarized">solarized</option><option value="nord">nord</option>
      <option value="gruvbox">gruvbox</option><option value="dracula">dracula</option><option value="sepia">sepia</option>
    </select>
    <button id="theme" class="ghost" aria-label="toggle light / dark">&#9680;</button>
    <button id="export-btn" class="ghost" aria-label="download decisions" hidden>download decisions</button>
    <button id="progress-btn" class="ghost" aria-label="progress">progress</button>
    <button id="info-btn" class="ghost" aria-label="how this works">how to</button>
    <button id="help-btn" class="ghost" aria-label="keyboard shortcuts">?</button>
  </div>
</header>

<div id="banner" class="banner" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>

<section id="tab-queue" class="tabpanel">
  <form id="filters" class="filters" onsubmit="return false">
    <div class="row2">
      <label id="f-country-wrap">country <select id="f-country"></select></label>
      <span id="f-state" class="countries" role="group" aria-label="state"></span>
      <label>decision <select id="f-decision"></select></label>
      <label>kind <select id="f-kind"></select></label>
      <label data-tip="the group of the GOGPT QC/Country checklist every change and item is sorted into; pick one to see everything in it, decided or not">checklist <select id="f-group"></select></label>
      <label>confidence <select id="f-tier"></select></label>
      <label class="check" data-tip="everything flagged with the ask-the-PM box, whatever its decision"><input type="checkbox" id="f-pm"> ask the PM</label>
      <label class="grow">search <input type="search" id="f-q" placeholder="plant name / GEM id / unit"></label>
      <button type="button" id="f-more" class="ghost" aria-expanded="false" aria-controls="more-filters">more filters</button>
      <button type="button" id="f-reset" class="ghost">reset</button>
    </div>
    <div id="more-filters" class="more-filters" hidden>
      <label>column <select id="f-column"><option value="">any</option></select></label>
      <label>batch <select id="f-dir"><option value="">any</option></select></label>
      <label>decided by <select id="f-by"><option value="">anyone</option></select></label>
      <label class="check" data-tip="plants whose Status is changed by a staged edit"><input type="checkbox" id="f-status"> status changes only</label>
    </div>
    <div id="active-filters" class="active-filters" hidden></div>
  </form>
  <div class="queue">
    <div class="pane">
      <div id="pane-mode" class="tabs pane-mode" role="tablist">
        <button type="button" data-view="plants" role="tab" aria-selected="true" data-tip="one row per plant, with how much is still to decide">plants</button>
        <button type="button" data-view="checklist" role="tab" aria-selected="false" data-tip="the groups of the GOGPT QC/Country checklist, with how much of each is still open; click one to filter the plants to it">checklist</button>
      </div>
      <ol id="pipes" class="pipes" aria-label="plants"></ol>
    </div>
    <article id="card" class="card" aria-live="polite"></article>
  </div>
</section>

<dialog id="dialog"></dialog>

<script src="app.js"></script>
</body>
</html>
